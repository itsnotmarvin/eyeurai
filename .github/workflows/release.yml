name: Release EyeUrAI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run release:check

      - name: Test interface
        run: npm test

      - name: Test Rust core
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust core
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build signed release draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: EyeUrAI v__VERSION__
          # Keep downloads private until every platform builds and the Windows
          # installer has proved that it can install and launch successfully.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          retryAttempts: 2
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Smoke-test Windows installer
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          ./scripts/windows-smoke.ps1 -Installer "src-tauri/target/release/bundle/nsis/EyeUrAI_${version}_x64-setup.exe"

      - name: Smoke-test macOS app bridge
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          app_path=$(find src-tauri/target -type d -path '*/release/bundle/macos/EyeUrAI.app' -print -quit)
          if [[ -z "$app_path" ]]; then
            echo "EyeUrAI.app was not found in the Tauri bundle output" >&2
            exit 1
          fi
          bash ./scripts/macos-smoke.sh "$app_path"

  publish-release:
    name: Publish verified release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release edit "v${version}" --draft=false --repo "${GITHUB_REPOSITORY}"
