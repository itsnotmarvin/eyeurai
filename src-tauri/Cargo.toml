[package]
name = "eyeurai"
version = "1.3.1"
description = "A private menu-bar monitor for AI subscription limits"
authors = ["EyeUrAI contributors"]
license = "MIT"
repository = "https://github.com/itsnotmarvin/eyeurai"
homepage = "https://github.com/itsnotmarvin/eyeurai"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "eyeurai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["process", "time", "rt-multi-thread", "macros", "io-util", "sync", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
dirs = "6"
url = "2"
sha2 = "0.10"
fs2 = "0.4"
getrandom = "0.3"
futures-util = "0.3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
